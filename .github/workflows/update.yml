name: Update inputs
on:
  workflow_dispatch:
  schedule:
    # Saturday 01:17 UTC (04:17 in Helsinki in summer). Hosts pick the update
    # up the following night, leaving the weekend to fix anything that breaks.
    - cron: 17 1 * * 6

permissions:
  contents: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    outputs:
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nix --option commit-lock-file-summary 'flake.lock: weekly update' \
            flake update --commit-lock-file

      - name: Push update branch
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "No input changes"
            exit 0
          fi
          git push --force origin HEAD:refs/heads/flake-update
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Builds every host from the update branch. If all of them build, the deploy
  # job in ci.yml fast-forwards main to the update and publishes it to hosts.
  build:
    needs: update
    if: needs.update.outputs.sha != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit

  report:
    needs:
      - update
      - build
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Report to Gatus
        env:
          TOKEN: ${{ secrets.GATUS_AUTO_UPGRADE_TOKEN }}
          SUCCESS: ${{ needs.update.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          error=""
          [ "$SUCCESS" = true ] || error="see $RUN_URL"
          curl -fsS --retry 3 -o /dev/null -X POST -G \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "success=$SUCCESS" \
            --data-urlencode "error=$error" \
            https://status.lajp.fi/api/v1/endpoints/ci_flake-update/external
